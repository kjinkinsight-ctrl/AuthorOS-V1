# CI for the AuthorOS Flutter application.
#
# This replaces GitHub's stock Dart starter template, which ran `dart pub get`
# at the repository root. There is no pubspec.yaml there — the app lives in
# flutter-author-studio-v1/ — so the job failed at its first step on every run
# since the workflow was added, without ever reaching a test.

name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: flutter-author-studio-v1

    steps:
      - uses: actions/checkout@v4

      # Pinned to the revision the project records in .metadata (6b182d2c75),
      # so CI analyses and tests on the same SDK the app is developed against.
      #
      # The action itself is pinned by commit SHA rather than the v2 tag, which
      # the publisher can repoint at any time: this workflow runs with write
      # access to the repository token, so the code behind that reference is
      # worth holding still. Matches how dart-lang/setup-dart was pinned here.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Errors fail the build. Warnings and lint infos are reported but do not,
      # because the tree carries a pre-existing backlog of them; tightening this
      # to --fatal-warnings is a sensible follow-up once that backlog is cleared.
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # The app ships to the web, so a release build is part of "does main
      # work". It also catches web-only compile failures that `flutter test`
      # on the host VM never sees.
      - name: Build web release
        run: flutter build web --release
