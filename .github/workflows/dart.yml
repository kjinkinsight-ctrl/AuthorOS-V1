# CI for the AuthorOS Flutter application.
#
# This replaces GitHub's stock Dart starter template, which ran `dart pub get`
# at the repository root. There is no pubspec.yaml there — the app lives in
# flutter-author-studio-v1/ — so the job failed at its first step on every run
# since the workflow was added, without ever reaching a test.

name: Flutter

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets a branch be re-checked without pushing an empty commit.
  workflow_dispatch:

# Read-only is all this job needs: it checks out, resolves, analyses, tests and
# builds. Nothing is published from here.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete. Without this,
# superseded runs were observed running to completion and burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # The observed job takes ~4 minutes. The point of the cap is that this suite
    # is 595 drift/NativeDatabase tests, and a widget test that deadlocks does
    # not fail — it hangs. That has already happened once in this repository.
    # Without a timeout the default ceiling is 360 minutes.
    timeout-minutes: 25

    defaults:
      run:
        working-directory: flutter-author-studio-v1

    steps:
      - uses: actions/checkout@v4

      # Pinned to the revision the project records in .metadata (6b182d2c75),
      # so CI analyses and tests on the same SDK the app is developed against.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # --enforce-lockfile makes CI fail on an out-of-date pubspec.lock rather
      # than silently resolving something different from what developers run.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Errors fail the build. Warnings and lint infos are reported but do not,
      # because the tree carries a pre-existing backlog of them; tightening this
      # to --fatal-warnings is a sensible follow-up once that backlog is cleared.
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # analyze + test both pass on code that fails to build: the asset
      # manifest, plugin registration and dart2js-only errors are only exercised
      # by a real build. Web is the cheapest platform to prove that on — Linux
      # would need ninja/GTK installed first and roughly doubles the job.
      - name: Build web release
        run: flutter build web --release
