# CI for the AuthorOS Flutter application.
#
# This workflow uses subosito/flutter-action, which is not certified by GitHub.
# It is provided by a third party and is governed by separate terms of service,
# privacy policy, and support documentation.

name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

defaults:
  run:
    # The app is not at the repository root — the repo also holds
    # indiauthors-platform, which this workflow does not build.
    working-directory: flutter-author-studio-v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Kept in step with the version netlify.toml pins, so a green build here
      # means the same toolchain the deploy uses.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Scoped to the application and its tests: tool/storage_benchmark.dart is
      # a dev script that imports a package this project does not depend on, so
      # analysing it fails on 21 pre-existing errors unrelated to the app.
      # Infos and warnings are non-fatal because the tree carries pre-existing
      # style issues; errors in lib/ or test/ still fail the build.
      - name: Analyze project source
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Drift runs SQLite as WebAssembly in the browser and loads it from the
      # site root, so the web build needs these two files present.
      - name: Provision drift web assets
        run: bash ../scripts/provision-drift-web-assets.sh

      # The product ships as a web application, so a release web build is part
      # of the gate. --no-web-resources-cdn matches the deploy: CanvasKit is
      # served from our own origin rather than gstatic.com.
      - name: Build web release
        run: flutter build web --release --no-web-resources-cdn
