# CI for the AuthorOS Flutter application.
#
# This replaces GitHub's stock Dart starter template, which ran `dart pub get`
# at the repository root. There is no pubspec.yaml there — the app lives in
# flutter-author-studio-v1/ — so the job failed at its first step on every run
# since the workflow was added, without ever reaching a test.

name: Flutter

# The repository runs two trunks (see BRANCHING.md): `main` is the release tree
# and `debug/base` is the integration line everything reaches first. Both are
# built on every arrival. Pull requests are gated wherever they land, including
# into a family trunk like `debug/map-studio/base`, so a studio branch is
# verified at its own trunk rather than first being discovered on `debug/base`.
# Pushes to work branches deliberately do not build: this job analyses, tests
# and produces a release web build, which costs more per commit of in-progress
# work than it catches, and the pull request into the family trunk covers the
# same ground.
on:
  push:
    branches: [ "main", "debug/base" ]
  pull_request:
    branches: [ "main", "debug/**", "rel/**" ]
  # Lets a branch be re-checked without pushing an empty commit.
  workflow_dispatch:

# Read-only is all this job needs: it checks out, resolves, analyses, tests and
# builds. Nothing is published from here.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete. Without this,
# superseded runs were observed running to completion and burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # The point of the cap is that this suite is thousands of
    # drift/NativeDatabase tests and growing, and a widget test that deadlocks
    # does not fail — it hangs. That has already happened once in this
    # repository. Without a timeout the default ceiling is 360 minutes.
    #
    # This branch proposed 25 when the suite was 830 tests and the job took
    # ~4 minutes. The trunk's 30 is kept instead: the suite has since passed
    # 2000 tests, so the headroom is worth more than the tighter cap.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: flutter-author-studio-v1

    steps:
      - uses: actions/checkout@v4

      # Pinned to the revision the project records in .metadata (6b182d2c75),
      # so CI analyses and tests on the same SDK the app is developed against.
      #
      # The action is pinned by commit SHA rather than the v2 tag, which its
      # publisher can repoint at any time. This job runs with a repository
      # token, so the code behind that reference is worth holding still —
      # dart-lang/setup-dart was pinned this way before it was replaced.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # --enforce-lockfile makes CI fail on an out-of-date pubspec.lock rather
      # than silently resolving something different from what developers run.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Errors fail the build. Warnings and lint infos are reported but do not,
      # because the tree carries a pre-existing backlog of them; tightening this
      # to --fatal-warnings is a sensible follow-up once that backlog is cleared.
      - name: Analyze project source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Drift runs SQLite as WebAssembly in the browser and loads it from the
      # site root, so the web build needs these two files present. They are
      # copied out of the resolved drift package, not committed.
      - name: Provision drift web assets
        run: bash ../scripts/provision-drift-web-assets.sh

      # AuthorOS ships as a web application, so a release web build is part of
      # the gate. Nothing exercised this path before, which is how browser-only
      # breakage reached main unnoticed. --no-web-resources-cdn matches the
      # deploy: CanvasKit is served from our own origin, not gstatic.com.
      - name: Build web release
        run: flutter build web --release --no-web-resources-cdn

      # Linux desktop is deliberately not built here.
      #
      # The target itself is sound: `flutter build linux --release` was run
      # successfully against this tree on Ubuntu 24.04 with Flutter 3.44.9 and
      # produced build/linux/x64/release/bundle/author_studio_v1.
      #
      # It is omitted because the GitHub-hosted ubuntu-latest image does not
      # ship the GTK 3 development libraries, so enabling it would mean adding
      # `sudo apt-get install -y ninja-build libgtk-3-dev` to every run. That is
      # a deliberate cost to take on, not an automatic one.
      # See flutter-author-studio-v1/docs/ci-pipeline.md.
