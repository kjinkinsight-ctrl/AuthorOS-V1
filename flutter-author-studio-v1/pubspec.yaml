name: author_studio_v1
description: AuthorOS Ink & Insight rebuilt in Flutter and Dart.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  package_info_plus: ^8.1.1
  pdf: ^3.13.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.1
  # Already in the tree via `pdf`; promoted to a direct dependency so EPUB
  # documents are built with a real XML writer. Author prose reaches XHTML, and
  # an ampersand or an angle bracket in a manuscript must not be able to produce
  # a file that will not parse.
  xml: ^7.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqlite3: ^3.5.1
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-400.ttf
          weight: 400
        - asset: assets/fonts/Merriweather-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
  assets:
    - assets/icon/authoros_icon.png
    - assets/author-studio-logo.png
    - assets/welcome-hero.png
    - assets/startup-doorway.png
    - assets/onboarding-doorway.png
    - assets/fonts/Inter-400.ttf
    - assets/fonts/Inter-700.ttf
    - assets/fonts/Merriweather-400.ttf
    - assets/fonts/Merriweather-700.ttf
    # The offline spelling dictionary. ~350 KB, and deliberately loaded lazily:
    # nothing touches it until a proofing pass runs. Licence in
    # assets/dictionaries/LICENSE.md.
    - assets/dictionaries/en.txt.gz

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/authoros_icon.png"
  image_path: "assets/icon/authoros_icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/authoros_icon.png"
    background_color: "#f4dfe7"
    theme_color: "#f4dfe7"
  windows:
    generate: true
    image_path: "assets/icon/authoros_icon.png"
    icon_size: 256
