<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Author Studio — The operating system for authors."
    >

    <meta
        name="theme-color"
        content="#111111"
    >

    <title>Author Studio</title>

    <!-- AuthorOS Styles -->
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/manuscript.css">
    <link rel="stylesheet" href="css/library.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/tutorial.css">
    <link rel="stylesheet" href="css/themes.css">
</head>

<body>

    <!-- Application Root -->
    <div id="authoros-app" class="authoros-app">

        <!-- Application Header -->
        <header
            id="app-toolbar"
            class="app-toolbar"
        >

            <div class="toolbar-left">

                <button
                    id="sidebar-toggle"
                    class="icon-button"
                    type="button"
                    aria-label="Toggle sidebar"
                    title="Toggle sidebar"
                >
                    <span class="toolbar-icon" aria-hidden="true">☰</span>
                </button>

                <div class="brand">
                    <span class="brand-mark">A</span>

                    <div class="brand-text">
                        <span class="brand-name">Author Studio</span>
                        <span
                            id="app-version"
                            class="brand-version"
                        >
                            v1.0.0
                        </span>
                    </div>
                </div>

            </div>

            <div class="toolbar-center">

                <div class="toolbar-title">
                    <span id="current-view-title">
                        Dashboard
                    </span>
                </div>

            </div>

            <div class="toolbar-right">

                <button
                    id="global-search-button"
                    class="icon-button search-bubble-button"
                    type="button"
                    aria-label="Open universal search"
                    title="Universal Search (Ctrl/Cmd+K)"
                >
                    <span class="toolbar-icon" aria-hidden="true">⌕</span>
                    <span class="search-bubble-label">Search</span>
                    <span class="search-bubble-shortcut" aria-hidden="true">Ctrl+K</span>
                </button>

                <button
                    id="notification-button"
                    class="icon-button notification-button"
                    type="button"
                    aria-label="Notifications"
                    title="Notifications"
                >
                    <span class="toolbar-icon" aria-hidden="true">🔔</span>
                    <span
                        id="notification-count"
                        class="notification-count hidden"
                    >
                        0
                    </span>
                </button>

                <button
                    id="theme-button"
                    class="icon-button"
                    type="button"
                    aria-label="Toggle theme"
                    title="Toggle theme"
                >
                    <span class="toolbar-icon" aria-hidden="true">◐</span>
                </button>

            </div>

        </header>


        <!-- Main Application Area -->
        <div class="app-body">

            <!-- Sidebar -->
            <aside
                id="app-sidebar"
                class="app-sidebar"
            >

                <div class="sidebar-section">

                    <div class="sidebar-section-title">
                        WORKSPACE
                    </div>

                    <nav
                        id="primary-navigation"
                        class="sidebar-navigation"
                        aria-label="Primary navigation"
                    >

                        <button
                            class="nav-item active"
                            type="button"
                            data-route="dashboard"
                        >
                            <span class="nav-icon">⌂</span>
                            <span class="nav-label">Dashboard</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="search"
                        >
                            <span class="nav-icon">⌕</span>
                            <span class="nav-label">Search</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="statistics"
                        >
                            <span class="nav-icon">◫</span>
                            <span class="nav-label">Statistics</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="backup-export"
                        >
                            <span class="nav-icon">⛁</span>
                            <span class="nav-label">Backup</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="projects"
                        >
                            <span class="nav-icon">▣</span>
                            <span class="nav-label">Projects</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="ideas"
                        >
                            <span class="nav-icon">✦</span>
                            <span class="nav-label">Ideas</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="manuscript"
                        >
                            <span class="nav-icon">▤</span>
                            <span class="nav-label">Manuscript</span>
                        </button>

                    </nav>

                </div>


                <div class="sidebar-section">

                    <div class="sidebar-section-title">
                        STORY
                    </div>

                    <nav class="sidebar-navigation">

                        <button
                            class="nav-item"
                            type="button"
                            data-route="chapters"
                        >
                            <span class="nav-icon">☷</span>
                            <span class="nav-label">Chapters</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="characters"
                        >
                            <span class="nav-icon">♙</span>
                            <span class="nav-label">Characters</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="world"
                        >
                            <span class="nav-icon">◈</span>
                            <span class="nav-label">World</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="plot"
                        >
                            <span class="nav-icon">◆</span>
                            <span class="nav-label">Plot</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="timeline"
                        >
                            <span class="nav-icon">◷</span>
                            <span class="nav-label">Timeline</span>
                        </button>

                        <button
                            class="nav-item"
                            type="button"
                            data-route="notes"
                        >
                            <span class="nav-icon">✎</span>
                            <span class="nav-label">Notes</span>
                        </button>

                    </nav>

                </div>


                <div class="sidebar-spacer"></div>


                <div class="sidebar-section sidebar-bottom">

                    <button
                        class="nav-item"
                        type="button"
                        data-route="settings"
                    >
                        <span class="nav-icon">⚙</span>
                        <span class="nav-label">Settings</span>
                    </button>

                </div>

            </aside>


            <!-- Main Content -->
            <main
                id="app-content"
                class="app-content"
                tabindex="-1"
            >

                <div
                    id="view-container"
                    class="view-container"
                >
                    <!-- Views are injected here -->
                </div>

            </main>

        </div>


        <!-- Status Bar -->
        <footer
            id="app-statusbar"
            class="app-statusbar"
        >

            <div class="status-left">

                <span
                    id="status-message"
                    class="status-message"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                >
                    Author Studio ready
                </span>

            </div>

            <div class="status-right">

                <span id="storage-status">
                    Local storage
                </span>

                <span class="status-divider">•</span>

                <span id="status-version">
                    v1.0.0
                </span>

            </div>

        </footer>


        <!-- Notification Container -->
        <div
            id="notification-container"
            class="notification-container"
            aria-live="polite"
            aria-atomic="true"
        ></div>


        <!-- Modal Container -->
        <div
            id="modal-container"
            class="modal-container"
        ></div>

    </div>


    <!-- AuthorOS Core -->
    <script src="js/core/state.js"></script>
    <script src="js/core/events.js"></script>
    <script src="js/core/registry.js"></script>
    <script src="js/core/project-model.js"></script>
    <script src="js/core/project-service.js"></script>
    <script src="js/core/diagnostics.js"></script>
    <script src="js/core/autosave.js"></script>
    <script src="js/core/core.js"></script>
    <script src="js/core/desktop.js"></script>

    <!-- Utilities -->
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/dates.js"></script>
    <script src="js/utils/validation.js"></script>
    <script src="js/utils/image-assets.js"></script>

    <!-- Application Services -->
    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>

    <!-- Components -->
    <script src="js/components/modal.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/cards.js"></script>
    <script src="js/components/search.js"></script>
    <script src="js/components/statistics.js"></script>
    <script src="js/components/backup-export.js"></script>
    <script src="js/components/settings-service.js"></script>
    <script src="js/components/tutorial-service.js"></script>

    <!-- Modules -->
    <script src="js/modules/dashboard.js"></script>
    <script src="js/modules/projects.js"></script>
    <script src="js/modules/ideas.js"></script>
    <script src="js/modules/manuscript.js"></script>
    <script src="js/modules/chapters.js"></script>
    <script src="js/modules/characters.js"></script>
    <script src="js/modules/world.js"></script>
    <script src="js/modules/plot.js"></script>
    <script src="js/modules/timeline.js"></script>
    <script src="js/modules/notes.js"></script>
    <script src="js/modules/search.js"></script>
    <script src="js/modules/statistics.js"></script>
    <script src="js/modules/backup-export.js"></script>
    <script src="js/modules/settings.js"></script>

    <!-- Application -->
    <script src="js/app.js"></script>

</body>
</html>
