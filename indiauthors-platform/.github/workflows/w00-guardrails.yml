name: W00 Guardrails

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  w00-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run W00 guardrail checks
        run: node ./tools/check-w00.mjs
