openapi: 3.1.0
info:
  title: Indie Authors Platform API
  version: 0.0.1
  description: API boundary for indiauthors.com account, commerce, licensing, downloads, support, and admin domains.
servers:
  - url: https://api.indiauthors.com
paths:
  /v1/auth/config:
    get:
      summary: Get authentication configuration and capability status
      operationId: getAuthConfig
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /v1/auth/login/start:
    post:
      summary: Start provider login flow by obtaining provider authorization URL
      operationId: startAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnUrl]
              properties:
                returnUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Login flow started
          content:
            application/json:
              schema:
                type: object
                required: [authorizeUrl]
                properties:
                  authorizeUrl:
                    type: string
                    format: uri
        "503":
          description: Provider integration required
  /v1/auth/logout:
    post:
      summary: Clear web session cookie
      operationId: logout
      responses:
        "200":
          description: Logged out
  /v1/account/summary:
    get:
      summary: Get authenticated account summary
      operationId: getAccountSummary
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"
        "401":
          description: Authentication required
        "503":
          description: Auth integration not configured
  /v1/health:
    get:
      summary: Service health check
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /v1/catalog/products:
    get:
      summary: List products and purchasable license options
      operationId: listCatalogProducts
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProductsResponse"
  /v1/catalog/products/{productCode}:
    get:
      summary: Get a single product from the catalog
      operationId: getCatalogProduct
      parameters:
        - name: productCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogProduct"
        "404":
          description: Product not found
  /v1/features/categories:
    get:
      summary: List AuthorOS feature categories
      operationId: listFeatureCategories
      responses:
        "200":
          description: Feature categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureCategoriesResponse"
  /v1/roadmap/items:
    get:
      summary: List roadmap items grouped by delivery state
      operationId: listRoadmapItems
      responses:
        "200":
          description: Roadmap items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadmapItemsResponse"
  /v1/checkout/sessions:
    post:
      summary: Create checkout session with payment provider
      operationId: createCheckoutSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineItems, successUrl, cancelUrl]
              properties:
                lineItems:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productCode, licenseType, quantity]
                    properties:
                      productCode:
                        type: string
                      licenseType:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                successUrl:
                  type: string
                  format: uri
                cancelUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Checkout session created
        "401":
          description: Unauthorized
  /v1/payments/webhooks/provider:
    post:
      summary: Payment provider webhook endpoint
      operationId: receivePaymentWebhook
      responses:
        "200":
          description: Accepted
        "400":
          description: Signature verification failed
  /v1/account/licenses:
    get:
      summary: List authenticated user licenses
      operationId: listMyLicenses
      responses:
        "200":
          description: Licenses list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountLicensesResponse"
        "401":
          description: Unauthorized
  /v1/licenses/verify-entitlement:
    post:
      summary: Verify whether a user is entitled for a product version and device
      operationId: verifyEntitlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementVerifyRequest"
      responses:
        "200":
          description: Entitlement result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitlementVerifyResponse"
        "400":
          description: Invalid request
  /v1/admin/licenses/{licenseId}/status:
    post:
      summary: Transition a license lifecycle status (admin)
      operationId: transitionLicenseStatus
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nextStatus]
              properties:
                nextStatus:
                  $ref: "#/components/schemas/LicenseStatus"
      responses:
        "200":
          description: Updated
        "403":
          description: Admin identity required
        "404":
          description: License not found
        "409":
          description: Invalid status transition
  /v1/downloads/releases:
    get:
      summary: List available releases for authenticated user entitlements
      operationId: listEntitledReleases
      responses:
        "200":
          description: Release list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadReleasesResponse"
        "401":
          description: Unauthorized
        "403":
          description: Entitlement required
  /v1/downloads/releases/{releaseId}/access:
    post:
      summary: Request entitlement-gated artifact access for a release platform artifact
      operationId: requestDownloadAccess
      parameters:
        - name: releaseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadAccessRequest"
      responses:
        "200":
          description: Download access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadAccessResponse"
        "401":
          description: Authentication required
        "403":
          description: Entitlement denied
        "404":
          description: Release or artifact not found
        "503":
          description: Download signing not configured
  /v1/downloads/config:
    get:
      summary: Get download delivery configuration status
      operationId: getDownloadsConfig
      responses:
        "200":
          description: Download config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadConfig"
  /v1/support/requests:
    post:
      summary: Submit a support request
      operationId: createSupportRequest
      responses:
        "201":
          description: Created
        "429":
          description: Rate limit exceeded
  /v1/admin/users:
    get:
      summary: Admin list users
      operationId: adminListUsers
      responses:
        "200":
          description: Admin user list
        "403":
          description: Forbidden
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ia_session
  schemas:
    CatalogLicenseType:
      type: object
      required:
        - licenseType
        - title
        - billingModel
        - priceAmountMinor
        - currency
      properties:
        licenseType:
          type: string
        title:
          type: string
        billingModel:
          type: string
          enum: [one_time, subscription]
        priceAmountMinor:
          type: integer
          minimum: 0
        compareAtAmountMinor:
          type: integer
          minimum: 0
        promoLabel:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
    CatalogProduct:
      type: object
      required:
        - productCode
        - name
        - description
        - availability
        - licenseTypes
      properties:
        productCode:
          type: string
        name:
          type: string
        description:
          type: string
        availability:
          type: string
          enum: [active, coming_soon]
        licenseTypes:
          type: array
          items:
            $ref: "#/components/schemas/CatalogLicenseType"
    CatalogProductsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
    FeatureCategory:
      type: object
      required:
        - id
        - title
        - availability
        - description
        - capabilities
      properties:
        id:
          type: string
        title:
          type: string
        availability:
          type: string
          enum: [available, planned]
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
    FeatureCategoriesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeatureCategory"
    RoadmapItem:
      type: object
      required:
        - id
        - lane
        - title
        - summary
        - updatedAt
      properties:
        id:
          type: string
        lane:
          type: string
          enum: [completed, current, in_development, planned, future_ideas]
        title:
          type: string
        summary:
          type: string
        updatedAt:
          type: string
          format: date-time
    RoadmapItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoadmapItem"
    AuthCapabilities:
      type: object
      required: [register, login, logout, passwordRecovery, accountDashboard]
      properties:
        register:
          type: boolean
        login:
          type: boolean
        logout:
          type: boolean
        passwordRecovery:
          type: boolean
        accountDashboard:
          type: boolean
    AuthConfig:
      type: object
      required: [mode, provider, integrationReady, capabilities]
      properties:
        mode:
          type: string
          enum: [disabled, external_oidc]
        provider:
          type: string
        integrationReady:
          type: boolean
        capabilities:
          $ref: "#/components/schemas/AuthCapabilities"
    AccountSummary:
      type: object
      properties:
        error:
          type: string
        summary:
          type: string
    LicenseStatus:
      type: string
      enum: [active, suspended, expired, revoked, cancelled]
    LicenseVersionAccess:
      type: object
      required: [minVersion, maxVersion]
      properties:
        minVersion:
          type: string
        maxVersion:
          type: string
          nullable: true
    License:
      type: object
      required:
        - id
        - userId
        - productCode
        - licenseType
        - status
        - purchaseDate
        - activationDate
        - expiryDate
        - allowedDevices
        - versionAccess
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        productCode:
          type: string
        licenseType:
          type: string
        status:
          $ref: "#/components/schemas/LicenseStatus"
        purchaseDate:
          type: string
          format: date-time
        activationDate:
          type: string
          format: date-time
          nullable: true
        expiryDate:
          type: string
          format: date-time
          nullable: true
        allowedDevices:
          type: integer
          minimum: 1
        versionAccess:
          $ref: "#/components/schemas/LicenseVersionAccess"
        devices:
          type: array
          items:
            type: string
    AccountLicensesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/License"
    EntitlementVerifyRequest:
      type: object
      required: [userId, productCode, appVersion, deviceId]
      properties:
        userId:
          type: string
        productCode:
          type: string
        appVersion:
          type: string
        deviceId:
          type: string
    EntitlementVerifyResponse:
      type: object
      required: [entitled, reason, license]
      properties:
        entitled:
          type: boolean
        reason:
          type: string
          enum:
            - ok
            - license_not_found
            - inactive_license
            - expired_date
            - version_out_of_range
            - device_limit_reached
        license:
          allOf:
            - $ref: "#/components/schemas/License"
          nullable: true
    ReleaseArtifact:
      type: object
      required: [platform, fileName, fileSizeBytes, checksumSha256, contentType]
      properties:
        platform:
          type: string
          enum: [windows, macos, linux]
        fileName:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        checksumSha256:
          type: string
        contentType:
          type: string
    ReleaseRecord:
      type: object
      required: [id, productCode, version, channel, publishedAt, notes, artifacts]
      properties:
        id:
          type: string
        productCode:
          type: string
        version:
          type: string
        channel:
          type: string
          enum: [stable, beta, legacy]
        publishedAt:
          type: string
          format: date-time
        notes:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseArtifact"
    DownloadReleasesResponse:
      type: object
      required: [items, releaseCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseRecord"
        releaseCount:
          type: integer
          minimum: 0
    DownloadAccessRequest:
      type: object
      required: [productCode, deviceId, platform]
      properties:
        productCode:
          type: string
        deviceId:
          type: string
        platform:
          type: string
          enum: [windows, macos, linux]
    DownloadAccessResponse:
      type: object
      required:
        - access
        - releaseId
        - version
        - platform
        - fileName
        - checksumSha256
        - contentType
        - fileSizeBytes
        - downloadUrl
        - expiresAt
      properties:
        access:
          type: string
          enum: [granted]
        releaseId:
          type: string
        version:
          type: string
        platform:
          type: string
          enum: [windows, macos, linux]
        fileName:
          type: string
        checksumSha256:
          type: string
        contentType:
          type: string
        fileSizeBytes:
          type: integer
          minimum: 1
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    DownloadConfig:
      type: object
      required: [downloadBaseUrl, signingConfigured, urlTtlSeconds]
      properties:
        downloadBaseUrl:
          type: string
          format: uri
        signingConfigured:
          type: boolean
        urlTtlSeconds:
          type: integer
          minimum: 1
security:
  - sessionCookie: []
